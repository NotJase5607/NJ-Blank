<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title> <!-- Changes the tab name to look like Google Drive -->
    <link rel="icon" type="image/x-icon" href="https://gstatic.com"> <!-- Sets Drive icon -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .launch-btn {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .launch-btn:hover {
            background-color: #2c974b;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <button class="launch-btn" onclick="launchBlank()">Open Dashboard</button>

    <script>
    function launchBlank() {
        // 1. Open a fresh tab with an empty history context
        var win = window.open('about:blank', '_blank');
        
        if (!win || win.closed) {
            alert('Pop-up blocked! Please allow pop-ups for this site to open the page.');
            return;
        }

        // 2. Build the fullscreen game window
        var iframe = win.document.createElement('iframe');
        iframe.style.width = "100vw";
        iframe.style.height = "100vh";
        iframe.style.border = "none";
        iframe.style.position = "fixed";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.margin = "0";
        iframe.style.padding = "0";
        
        // Points to your actual Google Site
        iframe.src = "https://google.com"; 

        // 3. Inject into the blank document
        win.document.body.style.margin = "0";
        win.document.body.appendChild(iframe);
        
        // 4. Force browser tab masking in the blank frame
        win.document.title = "Google Drive";
        var link = win.document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/x-icon';
        link.href = 'https://gstatic.com';
        win.document.head.appendChild(link);
    }
    </script>

</body>
</html>
